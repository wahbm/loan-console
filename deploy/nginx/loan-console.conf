# Include this file from the existing HTTPS server block. It intentionally
# contains only the Loan Console locations so shared Nginx routes remain intact.
location = /loan-console {
    return 301 /loan-console/;
}

location /loan-console/api/ {
    proxy_pass http://127.0.0.1:3200/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /loan-console/ {
    alias /srv/loan-console/current/apps/web/dist/;
    index index.html;
    try_files $uri $uri/ /loan-console/index.html;
}
